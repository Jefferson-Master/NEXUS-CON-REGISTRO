<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS Gaming Center</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#07101d;color:#f5f7ff}
button,input,select{font:inherit}
button{cursor:pointer}
.layout{display:flex;min-height:100vh}
aside{width:230px;background:#0b1424;border-right:1px solid #22304a;padding:18px}
.logo{font-size:28px;font-weight:900;text-align:center;margin-bottom:22px}
nav button{display:block;width:100%;border:0;background:transparent;color:#b8c3d6;text-align:left;padding:11px;border-radius:8px;margin:4px 0}
nav button:hover,nav button.active{background:#18243a;color:white}
main{flex:1;padding:25px;overflow:auto}
h1{margin:0 0 5px;font-size:30px}
.subtitle{color:#91a0b8;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:#111c2e;border:1px solid #263650;border-radius:12px;padding:16px}
.stat b{display:block;font-size:26px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.game{overflow:hidden;padding:0}
.gameimg{height:125px;display:grid;place-items:center;font-size:55px;background:linear-gradient(135deg,#283c73,#171b45)}
.gamebody{padding:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select{background:#0b1424;color:white;border:1px solid #30405b;border-radius:8px;padding:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px;border-bottom:1px solid #263650;text-align:left;font-size:13px}
th{color:#91a0b8}
.primary{border:0;border-radius:8px;background:#6d3df5;color:white;padding:10px 14px}
.secondary{border:1px solid #30405b;border-radius:8px;background:#121d31;color:white;padding:10px 14px}
.hidden{display:none}
.message{padding:15px;border-radius:9px;background:#10243a;color:#cfe2ff;margin-top:15px}
@media(max-width:800px){aside{width:180px}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.layout{display:block}aside{width:100%}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}.stats{grid-template-columns:1fr}}
</style>

<style>
.login-screen{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#050b15}
.login-box{width:380px;max-width:92%;background:#111c2e;border:1px solid #30405b;border-radius:16px;padding:30px;box-shadow:0 25px 80px #000}
.login-logo{text-align:center;font-size:34px;font-weight:900;margin-bottom:4px}
.login-sub{text-align:center;color:#91a0b8;font-size:11px;margin-bottom:22px}
.login-label{display:block;color:#aebbd0;font-size:12px;margin:12px 0 6px}
.login-input{width:100%;background:#091321;color:#fff;border:1px solid #30405b;border-radius:8px;padding:12px;outline:none}
.login-input:focus{border-color:#7c5cff}
.login-button{width:100%;margin-top:18px;border:0;border-radius:8px;background:#6d3df5;color:#fff;padding:12px;font-weight:bold;cursor:pointer}
.login-error{height:18px;text-align:center;color:#ff7777;font-size:12px;margin-top:10px}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
<div class="login-box">
<div class="login-logo">◈ NEXUS</div>
<div class="login-sub">GAMING CENTER · ACCESO</div>
<label class="login-label">USUARIO</label>
<input id="loginUser" class="login-input" type="text" autocomplete="username">
<label class="login-label">CONTRASEÑA</label>
<input id="loginPass" class="login-input" type="password" autocomplete="current-password">
<button id="loginButton" class="login-button" type="button">ENTRAR</button>
<div id="loginError" class="login-error"></div>
<div style="text-align:center;color:#71809a;font-size:11px;margin-top:12px">admin / admin123</div>
</div>
</div>
<div class="layout">
<aside>
  <div class="logo">◈ NEXUS</div>
  <nav id="nav"></nav>
</aside>
<main id="app"></main>
</div>

<script>
"use strict";

/* Datos simples generados en memoria.
   No usa localStorage, login, librerías ni servidores. */
const juegos=[
 ["Valorant","🎯","FPS"],["Counter-Strike 2","🔫","FPS"],
 ["Fortnite","🪂","Battle Royale"],["EA Sports FC","⚽","Deportes"],
 ["Call of Duty","💥","FPS"],["Rocket League","🚗","Deportes"],
 ["Tekken 8","🥊","Peleas"],["Forza Horizon 5","🏎️","Carreras"],
 ["Minecraft","⛏️","Sandbox"],["Apex Legends","🎯","Battle Royale"]
];

const clientes=[];
const ventas=[];
const compras=[];
const proveedores=[];
const empleados=[];
const sesiones=[];

for(let i=1;i<=5000;i++){
  clientes.push({
    id:i,nombre:"Cliente "+i,telefono:"555-"+String(1000+i),
    correo:"cliente"+i+"@nexus.local",membresia:["Free","Silver","Gold","Elite"][i%4]
  });
}
for(let i=1;i<=5000;i++){
  ventas.push({
    id:i,cliente:clientes[i%clientes.length].nombre,
    total:35+(i%250),metodo:["Efectivo","Tarjeta","Transferencia"][i%3],
    fecha:"2026-"+String(4+(i%5)).padStart(2,"0")+"-"+String(1+(i%28)).padStart(2,"0")
  });
}
for(let i=1;i<=2000;i++){
  proveedores.push({
    id:i,nombre:"Proveedor "+i,empresa:"Empresa NEXUS "+i,
    telefono:"555-"+String(6000+i),categoria:["Hardware","Snacks","Bebidas","Accesorios"][i%4]
  });
}
for(let i=1;i<=1500;i++){
  compras.push({
    id:i,proveedor:proveedores[i%proveedores.length].empresa,
    total:100+(i%500),fecha:"2026-"+String(4+(i%5)).padStart(2,"0")+"-"+String(1+(i%28)).padStart(2,"0")
  });
}
for(let i=1;i<=350;i++){
  empleados.push({
    id:i,nombre:"Empleado "+i,
    puesto:["Administrador","Cajero","Operador","Técnico","Supervisor"][i%5],
    telefono:"555-"+String(8000+i),estado:"Activo"
  });
}
for(let i=1;i<=8000;i++){
  sesiones.push({
    id:i,cliente:clientes[i%clientes.length].nombre,
    juego:juegos[i%juegos.length][0],horas:1+(i%6),
    total:30+(i%200)
  });
}

const pages={
 dashboard:"Dashboard",
 clientes:"Clientes",
 ventas:"Ventas",
 compras:"Compras",
 proveedores:"Proveedores",
 empleados:"Empleados",
 sesiones:"Sesiones",
 juegos:"Juegos",
 vista:"Vista del lugar",
 reportes:"Reportes"
};

const nav=document.getElementById("nav");
Object.keys(pages).forEach(k=>{
  const b=document.createElement("button");
  b.textContent=pages[k];
  b.onclick=()=>show(k);
  b.dataset.page=k;
  nav.appendChild(b);
});

function money(n){return "Q "+Number(n).toFixed(2)}

function show(page){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  const app=document.getElementById("app");

  if(page==="dashboard"){
    const total=ventas.reduce((a,v)=>a+v.total,0);
    app.innerHTML=`
      <h1>NEXUS Gaming Center</h1>
      <div class="subtitle">Centro de control</div>
      <div class="stats">
        <div class="card stat">Clientes<b>${clientes.length.toLocaleString()}</b></div>
        <div class="card stat">Ventas<b>${ventas.length.toLocaleString()}</b></div>
        <div class="card stat">Sesiones<b>${sesiones.length.toLocaleString()}</b></div>
        <div class="card stat">Ingresos<b>${money(total)}</b></div>
      </div>
      <div class="card" style="margin-top:15px">
        <h2>Estado del sistema</h2>
        <p>La aplicación funciona completamente dentro de este archivo HTML.</p>
        <p>No necesita contraseña, servidor, base de datos externa ni instalación.</p>
      </div>`;
    return;
  }

  if(page==="juegos"){
    app.innerHTML=`<h1>Juegos</h1><div class="subtitle">Catálogo incluido en el HTML</div>
      <div class="grid">${juegos.map(j=>`
      <div class="card game"><div class="gameimg">${j[1]}</div>
      <div class="gamebody"><h3>${j[0]}</h3><p>${j[2]}</p></div></div>`).join("")}</div>`;
    return;
  }

  if(page==="vista"){
    let pcs="";
    for(let i=1;i<=24;i++){
      pcs+=`<div class="card"><b>Estación ${String(i).padStart(2,"0")}</b><p>${i%3===0?"🔴 Ocupada":"🟢 Disponible"}</p></div>`;
    }
    app.innerHTML=`<h1>Vista del lugar</h1><div class="subtitle">Distribución de estaciones</div><div class="grid">${pcs}</div>`;
    return;
  }

  if(page==="reportes"){
    app.innerHTML=`
    <h1>Reportes</h1><div class="subtitle">Exportaciones básicas sin dependencias externas</div>
    <div class="grid">
      ${reportCard("Clientes","clientes")}
      ${reportCard("Ventas","ventas")}
      ${reportCard("Compras","compras")}
      ${reportCard("Proveedores","proveedores")}
      ${reportCard("Empleados","empleados")}
      ${reportCard("Sesiones","sesiones")}
    </div>`;
    return;
  }

  const data={clientes,ventas,compras,proveedores,empleados,sesiones}[page];
  renderTable(page,data);
}

function reportCard(title,type){
  return `<div class="card"><h3>${title}</h3>
    <p>${({clientes,ventas,compras,proveedores,empleados,sesiones}[type]).length.toLocaleString()} registros</p>
    <button class="secondary" onclick="downloadCSV('${type}')">Descargar CSV</button>
    <button class="primary" onclick="printData('${type}')">PDF / Imprimir</button>
  </div>`;
}

function renderTable(type,data){
  const app=document.getElementById("app");
  let headers=[];
  if(type==="clientes")headers=["ID","Nombre","Teléfono","Correo","Membresía"];
  if(type==="ventas")headers=["ID","Cliente","Total","Método","Fecha"];
  if(type==="compras")headers=["ID","Proveedor","Total","Fecha"];
  if(type==="proveedores")headers=["ID","Nombre","Empresa","Teléfono","Categoría"];
  if(type==="empleados")headers=["ID","Nombre","Puesto","Teléfono","Estado"];
  if(type==="sesiones")headers=["ID","Cliente","Juego","Horas","Total"];

  app.innerHTML=`
    <h1>${pages[type]}</h1>
    <div class="subtitle">${data.length.toLocaleString()} registros</div>
    <div class="toolbar">
      <input id="search" placeholder="Buscar..." oninput="filterTable('${type}')">
      <button class="secondary" onclick="downloadCSV('${type}')">Descargar CSV</button>
      <button class="primary" onclick="printData('${type}')">PDF / Imprimir</button>
      <button class="secondary" onclick="sendWhatsApp('${type}')">WhatsApp</button>
    </div>
    <div class="card" id="tableBox">${makeTable(headers,data.slice(0,300),type)}</div>
    <div class="message">Se muestran los primeros 300 registros para mantener la interfaz rápida. Los archivos de exportación incluyen todos.</div>`;
}

function makeTable(headers,data,type){
  return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
    data.map(x=>{
      let vals=[];
      if(type==="clientes")vals=[x.id,x.nombre,x.telefono,x.correo,x.membresia];
      if(type==="ventas")vals=[x.id,x.cliente,money(x.total),x.metodo,x.fecha];
      if(type==="compras")vals=[x.id,x.proveedor,money(x.total),x.fecha];
      if(type==="proveedores")vals=[x.id,x.nombre,x.empresa,x.telefono,x.categoria];
      if(type==="empleados")vals=[x.id,x.nombre,x.puesto,x.telefono,x.estado];
      if(type==="sesiones")vals=[x.id,x.cliente,x.juego,x.horas,money(x.total)];
      return "<tr>"+vals.map(v=>`<td>${v}</td>`).join("")+"</tr>";
    }).join("")
  }</tbody></table>`;
}

function filterTable(type){
  const q=document.getElementById("search").value.toLowerCase();
  const data={clientes,ventas,compras,proveedores,empleados,sesiones}[type];
  const found=data.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).slice(0,300);
  const headers={clientes:["ID","Nombre","Teléfono","Correo","Membresía"],
    ventas:["ID","Cliente","Total","Método","Fecha"],
    compras:["ID","Proveedor","Total","Fecha"],
    proveedores:["ID","Nombre","Empresa","Teléfono","Categoría"],
    empleados:["ID","Nombre","Puesto","Teléfono","Estado"],
    sesiones:["ID","Cliente","Juego","Horas","Total"]}[type];
  document.getElementById("tableBox").innerHTML=makeTable(headers,found,type);
}

function csvRows(type){
  const data={clientes,ventas,compras,proveedores,empleados,sesiones}[type];
  return data.map(x=>Object.values(x).map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");
}

function downloadCSV(type){
  const data={clientes,ventas,compras,proveedores,empleados,sesiones}[type];
  const header=Object.keys(data[0]).join(",");
  const blob=new Blob(["\ufeff"+header+"\n"+csvRows(type)],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="NEXUS_"+type+".csv";
  a.click();
}

function printData(type){
  const data={clientes,ventas,compras,proveedores,empleados,sesiones}[type];
  const w=window.open("","_blank");
  if(!w){alert("Permite ventanas emergentes para generar el PDF.");return}
  w.document.write("<html><head><title>NEXUS "+type+"</title><style>body{font:11px Arial}table{width:100%;border-collapse:collapse}td,th{border:1px solid #aaa;padding:5px}</style></head><body>");
  w.document.write("<h1>NEXUS Gaming Center - "+type+"</h1>");
  w.document.write("<p>Registros: "+data.length+"</p>");
  w.document.write("<table><tr>"+Object.keys(data[0]).map(x=>"<th>"+x+"</th>").join("")+"</tr>");
  data.forEach(x=>w.document.write("<tr>"+Object.values(x).map(v=>"<td>"+v+"</td>").join("")+"</tr>"));
  w.document.write("</table></body></html>");
  w.document.close();
  w.focus();
  setTimeout(()=>w.print(),500);
}

function sendWhatsApp(type){
  const data={clientes,ventas,compras,proveedores,empleados,sesiones}[type];
  const phone=prompt("Número de WhatsApp con código de país:");
  if(!phone)return;
  const text="NEXUS Gaming Center - "+type+"%0ARegistros: "+data.length;
  window.open("https://wa.me/"+phone.replace(/\D/g,"")+"?text="+text,"_blank");
}

show("dashboard");
</script>

<script>
(function(){
  var screen=document.getElementById('loginScreen');
  var user=document.getElementById('loginUser');
  var pass=document.getElementById('loginPass');
  var button=document.getElementById('loginButton');
  var error=document.getElementById('loginError');

  function login(){
    if(user.value.trim()==='admin' && pass.value==='admin123'){
      screen.remove();
    }else{
      error.textContent='Usuario o contraseña incorrectos';
      pass.value='';
      pass.focus();
    }
  }

  button.addEventListener('click',login);
  pass.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();login();}
  });
  user.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();pass.focus();}
  });
  user.focus();
})();
</script>
</body>
</html>
